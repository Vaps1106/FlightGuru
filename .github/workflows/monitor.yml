name: monitor

on:
  workflow_dispatch:          # MANUAL ONLY - runs when you trigger it
                              # (GitHub app, a phone Shortcut, or the Claude GitHub connector).
                              # To restore the 8-hour timer, add back:
                              #   schedule:
                              #     - cron: "0 */8 * * *"

permissions:
  contents: write             # needed to commit the updated price history back

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run price check
        env:
          PYTHONPATH: src
          PROVIDERS: serpapi   # change to "duffel,serpapi" once a live Duffel token is set
          DUFFEL_ACCESS_TOKEN: ${{ secrets.DUFFEL_ACCESS_TOKEN }}
          DUFFEL_VERSION: v2
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          SERPAPI_MAX_DATES: "8"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_EVERY_RUN: "true"
          ORIGIN: BOM
          DESTINATION: JFK
          SEARCH_START_DATE: "2026-07-20"
          SEARCH_END_DATE: "2026-08-14"
          SEARCH_DATE_STEP: "1"
          TARGET_PRICE: "700"
          CURRENCY: USD
        run: python -m flightguru.main

      - name: Commit updated price history
        run: |
          git config user.name "flightguru-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/flightguru.db || true
          git commit -m "chore: update price history [skip ci]" || echo "No changes to commit"
          git push || echo "Nothing to push"
